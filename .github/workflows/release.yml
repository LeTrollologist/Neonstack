name: Release

# Pushing a v* tag builds both self-contained archives on a networked runner and
# attaches them to the matching GitHub release (creating it if needed).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run the test suite
        run: dotnet run --project tests/NeonStack.Tests -c Release

      - name: Publish self-contained builds
        run: |
          dotnet publish NeonStack.csproj -c Release -r win-x64   --self-contained -o out/win-x64
          dotnet publish NeonStack.csproj -c Release -r linux-x64 --self-contained -o out/linux-x64

      - name: Check the licence notice ships
        run: |
          test -f out/win-x64/NOTICE.txt
          test -f out/linux-x64/NOTICE.txt
          test -f out/win-x64/NeonStack.exe
          test -f out/linux-x64/NeonStack

      - name: Package
        run: |
          cd out/win-x64   && zip -qr "$GITHUB_WORKSPACE/NeonStack-${GITHUB_REF_NAME}-win-x64.zip"   . && cd ../..
          cd out/linux-x64 && zip -qr "$GITHUB_WORKSPACE/NeonStack-${GITHUB_REF_NAME}-linux-x64.zip" . && cd ../..

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NeonStack-*.zip --clobber
          else
            gh release create "$TAG" --title "NEON STACK $TAG" --generate-notes NeonStack-*.zip
          fi
